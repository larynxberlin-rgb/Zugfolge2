    trustBoundary: Executes a checksummed upstream binary against untrusted repository content and history without receiving repository secrets or write permissions.
    updateMethod: Review the exact release, checksums, license, ruleset changes, advisories, and synthetic-marker behavior before updating both platform downloads.
    rollback: Remove the isolated secret-scan jobs and configuration while retaining repository credential-pattern tests.

