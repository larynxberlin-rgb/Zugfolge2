pythonBuildPackages:
  - name: hatchling
    version: 1.27.0
    scope: BUILD
    owningSlice: MS-002-S03
    licenseExpression: MIT
    purpose: PEP 517 sdist, wheel, and editable backend for both first-party Python packages
    officialSource: https://pypi.org/project/hatchling/1.27.0/
    trustBoundary: Executes downloaded backend code in an isolated build environment and is absent from runtime dependency sets.
    updateMethod: Review the upstream release and license, update every exact root/member/build-constraint pin and verified hash, regenerate uv.lock, then repeat clean sync and build verification.
    rollback: Revert the S03 workspace, uv.lock, build constraints, and member build metadata together.
  - name: editables
    version: 0.6
    scope: BUILD
    owningSlice: MS-002-S03
    licenseExpression: MIT
    purpose: Hatchling helper used only to install both workspace packages in editable mode
    officialSource: https://pypi.org/project/editables/0.6/
    trustBoundary: Executes during isolated editable installation in uv sync and must remain absent from shipped runtime dependency sets.
    updateMethod: Review the upstream release and license, update its exact root/build-constraint pin and hashes, regenerate uv.lock, then repeat clean sync, import, and build verification.
    rollback: Restore version 0.6 with its recorded hashes or revert the complete S03 workspace change.

coverageTools:
  - name: node-v8-coverage
    version: 24.18.0
    scope: TEST
    owningSlice: MS-002-S05
    licenseExpression: MIT
    purpose: Produce relative machine-readable function and range coverage for Node tests without another package
    officialSource: https://nodejs.org/api/cli.html#node_v8_coverage-dir
    trustBoundary: Executes repository tests in child Node processes and sanitizes raw absolute V8 paths before evidence is retained.
    updateMethod: Update only with the approved exact Node toolchain and re-verify the summary schema on Windows and Linux.
    rollback: Remove the S05 Node coverage script and package command while retaining native tests.
  - name: coverage.py
    version: 7.15.2
    scope: TEST
    owningSlice: MS-002-S05
    licenseExpression: Apache-2.0
    purpose: Produce branch and line coverage JSON/XML for both Python workspace packages
    officialSource: https://pypi.org/project/coverage/7.15.2/
    trustBoundary: Executes both repository unittest suites from the locked uv environment and writes only ignored local evidence.
    updateMethod: Review upstream release/license, update the exact uv pin and dependency record, regenerate uv.lock, then repeat both coverage suites.
    rollback: Remove the exact dev dependency and Python coverage runner, regenerate uv.lock, and retain native unittest commands.
  - name: JaCoCo
    version: 0.8.15
    scope: TEST
    owningSlice: MS-002-S05
    licenseExpression: EPL-2.0
    purpose: Produce branch and line coverage XML/HTML for the game-server JVM tests
    officialSource: https://www.jacoco.org/jacoco/
    trustBoundary: Instruments and executes repository JVM test bytecode through Gradle; it is absent from production runtime configurations.
    updateMethod: Review upstream release/license, update the exact toolVersion, locks and verification metadata, then repeat the warning-free clean build.
    rollback: Remove the JaCoCo plugin/report task and restore the prior app lock and verification metadata while retaining JUnit tests.

contractValidators:
  - name: "@redocly/cli"
    version: 2.42.0
    scope: DEVELOPMENT
    owningSlice: MS-002-S05
    licenseExpression: MIT
    purpose: Validate the OpenAPI 3.1 contract with the pinned spec ruleset and local-reference resolution
    officialSource: https://github.com/Redocly/redocly-cli/releases/tag/%40redocly%2Fcli%402.42.0
    trustBoundary: Executes only after repository-owned reference confinement rejects escaping or remote references; receives contract files but no credentials or production data.
    updateMethod: Review the exact upstream release, npm integrity, license, advisories, OpenAPI 3.1 behavior, and release-age quarantine before changing the pin and lock.
    rollback: Remove the S05 OpenAPI validator invocation and exact development dependency while retaining JSON Schema and reference checks.
  - name: "@asyncapi/specs"
    version: 6.11.1
    scope: DEVELOPMENT
    owningSlice: MS-002-S05
    licenseExpression: Apache-2.0
    purpose: Supply the official bundled AsyncAPI 3.0 JSON Schema used by the locked Ajv validator
    officialSource: https://github.com/asyncapi/spec-json-schemas/releases/tag/v6.11.1
    trustBoundary: Loads a data-only bundled schema from the integrity-pinned npm artifact; it runs no lifecycle script and receives no credentials or production data.
    updateMethod: Never float this pin; review npm provenance, upstream advisories and incident history, schema changes, license, and integrity before an isolated update.
    rollback: Remove the S05 AsyncAPI schema import and exact development dependency while retaining repository reference checks.

sourceValidators:
  - name: typescript
    version: 5.9.3
    scope: DEVELOPMENT
    owningSlice: MS-002-S05
    licenseExpression: Apache-2.0
    purpose: Parse untrusted JavaScript and TypeScript repository source into syntax trees for deterministic module-boundary validation
    officialSource: https://github.com/microsoft/TypeScript/releases/tag/v5.9.3
    trustBoundary: Parses repository-controlled but untrusted source text in the local and CI lint process without executing that source; receives no credentials or production data.
    updateMethod: Review the exact upstream release, npm integrity, license, advisories, parser changes, and adversarial boundary fixtures before changing the pin and lock.
    rollback: Revert the parser integration and exact dependency record together only after an independently reviewed fail-closed replacement preserves the module-boundary tests.

securityTools:
