licensing:
  status: HUMAN_REVIEW_REQUIRED
  currentRootLicense: UNLICENSED
  firstLicensedCommit: null
  components:
    - scope: Original runtime code, web client, game server, simulation, data pipeline, live gateway, and Odoo bridge
      candidate: AGPL-3.0-or-later; EUPL-1.2 is the EU-oriented alternative
      status: HUMAN_REVIEW_REQUIRED
      humanGate: Project owner and qualified software-license counsel
    - scope: Public OpenAPI, AsyncAPI, JSON Schemas, and generated public SDKs
      candidate: Apache-2.0
      status: HUMAN_REVIEW_REQUIRED
      humanGate: Project owner and qualified software-license counsel
    - scope: Specifications, ADRs, planning, and original documentation
      candidate: CC-BY-4.0
      status: HUMAN_REVIEW_REQUIRED
      humanGate: Project owner and qualified software-license counsel
    - scope: Original synthetic fixtures explicitly approved for redistribution
      candidate: CC0-1.0
      status: HUMAN_REVIEW_REQUIRED
      humanGate: Rights-holder and asset-provenance review
    - scope: OSM-derived infrastructure database
      candidate: ODbL-1.0 with attribution and database-offer obligations
      status: HUMAN_REVIEW_REQUIRED
      humanGate: Qualified data-license review
    - scope: Zugfolge name, Block-Z, claim, logos, cosmetics, soundtrack, and premium art
      candidate: All rights reserved with a separate trademark and asset policy
      status: HUMAN_REVIEW_REQUIRED
      humanGate: Rights-holder and trademark counsel
  ownerQuestions:
    - May a third party operate a public commercial fork if it complies with network copyleft?
    - Is AGPL-3.0-or-later or AGPL-3.0-only intended?
    - Is a later proprietary or OEM dual-license channel genuinely required?
    - Which natural or legal person is the licensor, trademark owner, and contracting party?
    - Will contributions use inbound-equals-outbound plus DCO, or is a CLA required before any external contribution?
  nextAction: Keep every package UNLICENSED and contributions closed until the owner answers these questions and the rights chain is approved.

