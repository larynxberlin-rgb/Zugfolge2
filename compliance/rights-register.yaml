    - APPROVED_WITH_CONDITIONS
    - SUBSTITUTED
    - EXCLUDED
    - REJECTED
  blockingSourceStatuses:
    - CANDIDATE
    - HUMAN_REVIEW_REQUIRED
    - CONTRACT_REQUIRED
    - EXPIRED
  requiredSnapshotFields:
