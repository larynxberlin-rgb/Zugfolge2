name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-foundation:
    name: Web foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependency graph
        run: pnpm audit --audit-level=high

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Build and test
        run: pnpm test

  integration-kernels:
    name: Data and Odoo kernels
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.14

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.0
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked Python workspace
        run: uv sync --all-packages --locked

      - name: Compile Python sources
        run: uv run python -m compileall -q apps/data-pipeline/src integrations/odoo/src

      - name: Test data provenance
        run: uv run python -m unittest discover -s apps/data-pipeline/tests -v

      - name: Test Odoo trust boundary
        run: uv run python -m unittest discover -s integrations/odoo/tests -v

      - name: Build data pipeline with hashed backend closure
        run: uv build --package zugfolge-data-pipeline --build-constraints build-constraints.txt --require-hashes

      - name: Build Odoo bridge with hashed backend closure
        run: uv build --package zugfolge-odoo-bridge --build-constraints build-constraints.txt --require-hashes
