name: Supply chain

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Locked evidence and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.14

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.0
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Temurin
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21.0.12+8.0.LTS

      - name: Install checksummed Gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          directory="$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir --parents "$directory"
          tar --extract --gzip --file "$archive" --directory "$directory" gitleaks
          echo "$directory" >> "$GITHUB_PATH"

      - name: Synchronize locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --all-packages --locked

      - name: Verify workflow and secret policies
        run: |
          node tools/verify-workflows.mjs
          node --test tests/supply-chain-policy.test.mjs tests/repository-policy.test.mjs
          gitleaks git --config=.gitleaks.toml --redact --no-banner

      - name: Generate locked evidence
        run: node tools/run-supply-chain.mjs

      - name: Validate CycloneDX evidence
        run: node tools/verify-sbom.mjs

      - name: Upload MS-002 evidence
        id: evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zugfolge-ms002-evidence
          path: |
            outputs/coverage
            outputs/sbom
          if-no-files-found: error
          retention-days: 30

      - name: Publish evidence summary
        env:
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          echo "### MS-002 supply-chain evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`zugfolge-ms002-evidence\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retention: 30 days" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256 digest: \`${ARTIFACT_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
